syntax = "proto3";

package rpc;

// RPC协议头（可选，通常协议头不使用protobuf，还是手动处理更灵活）
message RpcHeader {
  uint32 magic = 1;
  uint32 body_len = 2;
  uint32 msg_id = 3;
}

// 请求消息体
message RpcRequest {
  string service_name = 1;
  string method_name = 2;
  string params = 3; // 参数以JSON字符串形式传输或定义更详细的message结构
}

// 响应消息体
message RpcResponse {
  int32 code = 1;
  string result = 2; // 同样以JSON字符串形式传输，或使用嵌套message
}
